services:
  bookmarks-server:
    build:
      context: ..
      dockerfile: harness/Dockerfile
    env_file: .env
    environment:
      BOOKMARKS_HOST: 0.0.0.0
    ports:
      # Loopback only by default; expose via Tailscale or a TLS reverse proxy
      # rather than binding to the WAN (design §8).
      - "127.0.0.1:${BOOKMARKS_PORT:-8787}:8787"
    volumes:
      - bookmarks-data:/app/data
    restart: unless-stopped

volumes:
  bookmarks-data:
